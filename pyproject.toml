[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="affectcontrol"
version="0.2.0"
description="Experimental appraisal-control evaluation harness for long-horizon agents"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="chanokfortyzz", email="chanokfortyzz@gmail.com"}]
dependencies=[]

[project.optional-dependencies]
dev=["pytest>=8"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
