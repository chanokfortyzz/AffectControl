[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="affectcontrol"
version="0.2.0"
description="Experimental appraisal-control evaluation harness for long-horizon agents"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="chanokfortyzz", email="chanokfortyzz@gmail.com"}]
dependencies=[]

[project.optional-dependencies]
dev=["pytest>=8"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]

[project.scripts]
affectcontrol-pilot="affectcontrol.pilot:main"
affectcontrol-shadow-eval="affectcontrol.shadow_eval:main"
affectcontrol-shadow-ingest="affectcontrol.shadow_ingest:main"
affectcontrol-coverage-audit="affectcontrol.coverage_audit:main"
affectcontrol-lifecycle-audit="affectcontrol.lifecycle_audit:main"
affectcontrol-receipt-audit="affectcontrol.receipt_audit:main"
